<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 2 – API Fetch Demo</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <header class="app-header">
        <h1>Internet Shop – Lab 2 (Fetch)</h1>
        <div class="env-select">
            <label for="base-url">Base API URL:</label>
            <input id="base-url" type="text" placeholder="http://127.0.0.1:8000/api/v1" />
            <button id="save-base" type="button">Use</button>
        </div>
        <form id="login-form" class="env-select">
            <label for="username-input">Username:</label>
            <input id="username-input" type="text" placeholder="Username" autocomplete="username" required />
            <label for="password-input">Password:</label>
            <input id="password-input" type="password" placeholder="Password" autocomplete="current-password" required />
            <button id="login-button" type="submit">Login</button>
        </form>
    </header>

    <main class="layout">
        <section class="panel" aria-labelledby="products-title">
            <div class="panel-header">
                <h2 id="products-title">Products</h2>
                <button id="refresh-products" type="button">Refresh</button>
            </div>
            <div id="products-list" class="list"></div>
        </section>

        <section class="panel" aria-labelledby="users-title">
            <div class="panel-header">
                <h2 id="users-title">Users</h2>
                <div class="row">
                    <input id="user-id-input" type="number" min="1" placeholder="User ID" />
                    <button id="load-user-orders" type="button">Load Orders</button>
                </div>
            </div>
            <div id="orders-list" class="list"></div>
        </section>

        <section class="panel" aria-labelledby="cart-title">
            <div class="panel-header">
                <h2 id="cart-title">Cart Items</h2>
                <button id="refresh-cart" type="button">Refresh</button>
            </div>
            <div id="cart-list" class="list"></div>
        </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
